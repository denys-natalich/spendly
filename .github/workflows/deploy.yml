name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The patch number is the deploy counter, so every push to main ships a
      # visibly newer version: run 14 is 1.0.1, run 15 is 1.0.2, and so on. For
      # a feature release bump the minor in package.json and set RUN_OFFSET to
      # the run number of that release, which restarts the patches at .0.
      - name: Derive version
        env:
          RUN_OFFSET: 13
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "VITE_APP_VERSION=$base.$(( ${{ github.run_number }} - RUN_OFFSET ))" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          # These are baked into the client bundle and are public by design —
          # the anon/publishable key is protected by row level security, not by
          # secrecy. They live in Actions secrets only to keep them out of the
          # repository source.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
